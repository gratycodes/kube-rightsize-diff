apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cart-redis
  namespace: shop
spec:
  replicas: 1
  serviceName: cart-redis
  selector:
    matchLabels: {app: cart-redis}
  template:
    metadata:
      labels: {app: cart-redis}
    spec:
      containers:
        - name: redis
          image: redis:7.4
          resources:
            requests: {cpu: 200m, memory: 300Mi}
            limits: {memory: 300Mi}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: monitoring
spec:
  selector:
    matchLabels: {app: node-agent}
  template:
    metadata:
      labels: {app: node-agent}
    spec:
      containers:
        - name: agent
          image: ghcr.io/example/node-agent:3.2.0
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
