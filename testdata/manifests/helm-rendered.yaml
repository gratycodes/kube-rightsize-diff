---
# Source: web/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  ports: [{port: 80}]
---
# Source: web/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      initContainers:
        - name: migrate
          image: example/migrate:1
          resources:
            requests: {cpu: 50m, memory: 64Mi}
      containers:
        - name: web
          image: example/web:1
          resources:
            limits: {cpu: 500m, memory: 256Mi}
        - name: sidecar
          image: example/sidecar:1
          resources:
            requests: {cpu: 0.05, memory: "67108864"}
---
