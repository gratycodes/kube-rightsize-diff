# The simulated PR: idler's CPU request jumps to 1 core (waste) and
# spinner's request is cut to 10m (below observed usage).
apiVersion: v1
kind: Namespace
metadata:
  name: e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idler
  namespace: e2e
spec:
  replicas: 2
  selector:
    matchLabels: {app: idler}
  template:
    metadata:
      labels: {app: idler}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 1; done"]
          resources:
            requests: {cpu: "1", memory: 32Mi}
            limits: {memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spinner
  namespace: e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: spinner}
  template:
    metadata:
      labels: {app: spinner}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do :; done"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
